PACKAGE_NAME="zt9101"
PACKAGE_VERSION="1.2.1800"
BUILT_MODULE_NAME[0]="zt9101_ztopmac_usb"
DEST_MODULE_LOCATION[0]="/extra"
# Call kbuild directly: the driver's own Makefile skips its targets when DKMS passes KERNELRELEASE.
MAKE[0]="make -j$(nproc) -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build WDRV_DIR=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_ZT9xxx=m modules"
AUTOINSTALL="yes"
